name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Tests use an in-memory Postgres (PGlite): no database service needed.
      - run: pnpm test
      # No DATABASE_URL here, so the build skips migrations and only checks that the app compiles.
      - run: pnpm build
